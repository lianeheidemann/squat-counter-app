name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name squat_counter_app --org com.lianeheidemann .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: squat-counter-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            build/app/outputs/flutter-apk/app-debug.apk#squat-counter-v1.0.0-debug.apk \
            --title "v1.0.0 - Dark Green Interface" \
            --notes "First test release of Squat Counter. Includes the dark green interface, English naming throughout the project, the new launcher icon, and automatic squat counting with the phone accelerometer. This is a debug APK intended for testing."
