name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name squat_counter_app --org com.lianeheidemann .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: squat-counter-v1.1.0-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0             build/app/outputs/flutter-apk/app-release.apk#squat-counter-v1.1.0.apk             --title "v1.1.0 - Refined Workout Interface"             --notes "New compact dark interface inspired by the approved visual reference. Includes refined typography, smaller controls and cards, clearer workout progress, improved completion dialog, and the existing automatic squat counting features."
