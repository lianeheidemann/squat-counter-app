name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name squat_counter_app --org com.lianeheidemann .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk squat-counter-v1.2.0-new-interface.apk

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: squat-counter-v1.2.0-new-interface
          path: squat-counter-v1.2.0-new-interface.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0             squat-counter-v1.2.0-new-interface.apk             --title "v1.2.0 - New Editorial Interface"             --notes "A complete visual redesign based on the approved reference: new woman-squatting hero image, neutral charcoal-gray palette, lighter and smaller typography, compact controls, and clearer hierarchy. Automatic squat counting and all existing features are preserved."
