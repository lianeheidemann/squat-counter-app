name: squat_counter_app
description: "A Flutter app that counts squats using the phone accelerometer."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  sensors_plus: ^6.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/squat-counter-icon.png"
  adaptive_icon_background: "#07100E"
  adaptive_icon_foreground: "assets/squat-counter-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/squat-counter-icon.png
